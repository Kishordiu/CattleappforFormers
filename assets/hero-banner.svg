<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="auto">
  <defs>
    <!-- Agrarian Deep Soil Gradients -->
    <radialGradient id="soilVoid" cx="72%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#14261B" />
      <stop offset="45%" stop-color="#0A160F" />
      <stop offset="100%" stop-color="#050A07" />
    </radialGradient>

    <!-- Pasture Emerald & Harvest Amber Radiance -->
    <radialGradient id="pastureGlow" cx="74%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.4" />
      <stop offset="30%" stop-color="#F59E0B" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#064E3B" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#050A07" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="pastureBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#065F46" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.9" />
    </linearGradient>

    <!-- Topographic Contour Pattern -->
    <pattern id="topoGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0 20 Q 10 10 20 20 T 40 20 M 0 40 Q 10 30 20 40 T 40 40" fill="none" stroke="#10B981" stroke-opacity="0.08" stroke-width="1" />
    </pattern>

    <!-- Keyframe Motion Animations -->
    <style>
      @keyframes ekgPulse {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes sensorRing {
        0% { r: 12px; opacity: 0.9; }
        100% { r: 75px; opacity: 0; }
      }
      @keyframes vitalsBlink {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; }
      }
      @keyframes herdRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .ekg-line {
        stroke-dasharray: 600;
        animation: ekgPulse 4s linear infinite;
      }
      .sensor-wave {
        animation: sensorRing 3s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      }
      .vitals-live {
        animation: vitalsBlink 1.8s ease-in-out infinite;
      }
      .radial-contour {
        transform-origin: 740px 145px;
        animation: herdRotate 35s linear infinite;
      }

      .headline-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Geist Sans", sans-serif;
        font-weight: 900;
        letter-spacing: -0.04em;
        fill: #F0FDF4;
      }
      .mono-chip {
        font-family: "JetBrains Mono", Consolas, monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Agrarian Soil Plate -->
  <rect width="960" height="320" rx="24" fill="url(#soilVoid)" />
  <rect width="960" height="320" rx="24" fill="url(#topoGrid)" />
  <rect width="960" height="320" rx="24" fill="url(#pastureGlow)" />
  
  <!-- Outer Clover Emerald Border -->
  <rect x="2" y="2" width="956" height="316" rx="22" fill="none" stroke="url(#pastureBorder)" stroke-width="1.8" />
  <path d="M 28 6 L 932 6" stroke="#86EFAC" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round" />

  <!-- ==================== LIVESTOCK BIOMETRICS & TOPOGRAPHIC CONTOURS ==================== -->

  <!-- Topographic Elevation Rings -->
  <g class="radial-contour" opacity="0.35">
    <ellipse cx="740" cy="145" rx="140" ry="75" fill="none" stroke="#10B981" stroke-width="1" stroke-dasharray="8 6" />
    <ellipse cx="740" cy="145" rx="110" ry="58" fill="none" stroke="#F59E0B" stroke-width="0.8" stroke-dasharray="4 8" />
    <ellipse cx="740" cy="145" rx="75" ry="40" fill="none" stroke="#34D399" stroke-width="0.8" />
  </g>

  <!-- Central Biometric Ear-Tag IoT Sensor Node -->
  <circle cx="740" cy="145" r="14" fill="#064E3B" stroke="#10B981" stroke-width="2" />
  <circle cx="740" cy="145" r="5" fill="#F0FDF4" />
  <!-- Radio Wave Broadcast Rings -->
  <circle cx="740" cy="145" r="10" fill="none" stroke="#10B981" stroke-width="1.5" class="sensor-wave" />

  <!-- Live Biometric EKG Heartbeat Pulse Wave Trace -->
  <path d="M 600 190 L 660 190 L 675 160 L 690 220 L 705 130 L 720 210 L 735 185 L 750 190 L 880 190" 
        fill="none" stroke="#10B981" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="ekg-line" />

  <!-- Ambient Glow Behind Heartbeat Peak -->
  <circle cx="705" cy="130" r="18" fill="#10B981" opacity="0.2" filter="blur(6px)" />
  <circle cx="705" cy="130" r="3" fill="#F0FDF4" />

  <!-- Live Herd Intelligence HUD Card -->
  <g transform="translate(635, 248)" class="mono-chip">
    <rect x="0" y="0" width="285" height="46" rx="10" fill="#0A1C12" stroke="#047857" stroke-width="1" opacity="0.95" />
    <circle cx="14" cy="17" r="3.5" fill="#10B981" class="vitals-live" />
    <text x="26" y="20" fill="#86EFAC" font-size="10" font-weight="700">HERD VITALS: 98.4% OPTIMAL HEALTH</text>
    <text x="14" y="36" fill="#FDE68A" font-size="8.5">BREEDING PREDICT: +18.2% · WHAT-IF MODEL ACTIVE</text>
  </g>

  <!-- ==================== LEFT EDITORIAL & IDENTITY BLOCK ==================== -->
  <g transform="translate(52, 54)">
    <rect x="0" y="0" width="255" height="28" rx="14" fill="#0D2E1B" stroke="#047857" stroke-width="1.2" />
    <circle cx="14" cy="14" r="4.5" fill="#10B981" class="vitals-live" />
    <text x="28" y="18" fill="#86EFAC" class="mono-chip" font-size="11" font-weight="700">AGRITECH · DECISION INTELLIGENCE</text>

    <text x="0" y="80" class="headline-text" font-size="44">CATTLE CARE FOR FARMERS</text>

    <text x="0" y="122" fill="#D1FAE5" font-size="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
      Herd Economics, Biometric Telemetry &amp; What-If Simulation Engine
    </text>

    <!-- Pasture Emerald & Gold Accent Strip -->
    <g transform="translate(0, 146)">
      <rect x="0" y="0" width="50" height="3" fill="#10B981" rx="1.5" />
      <rect x="54" y="0" width="50" height="3" fill="#F59E0B" rx="1.5" />
      <rect x="108" y="0" width="30" height="3" fill="#34D399" rx="1.5" />
    </g>

    <!-- Tech Specs Badges -->
    <g transform="translate(0, 182)" class="mono-chip" font-size="10.5">
      <rect x="0" y="0" width="138" height="22" rx="6" fill="#061F12" stroke="#065F46" stroke-width="1" />
      <text x="12" y="15" fill="#86EFAC">I18N MULTILINGUAL</text>

      <rect x="148" y="0" width="128" height="22" rx="6" fill="#061F12" stroke="#065F46" stroke-width="1" />
      <text x="160" y="15" fill="#FDE68A">FRAMER MOTION</text>

      <rect x="286" y="0" width="128" height="22" rx="6" fill="#061F12" stroke="#065F46" stroke-width="1" />
      <text x="298" y="15" fill="#34D399">HERD SIMULATION</text>
    </g>

    <g transform="translate(0, 230)">
      <text x="0" y="0" fill="#3E7553" class="mono-chip" font-size="9.5">
        DIU FOUNDRY · EMPOWERING RURAL SUSTAINABILITY WITH EMPIRICAL TELEMETRY
      </text>
    </g>
  </g>
</svg>